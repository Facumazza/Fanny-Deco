services:
  postgres:
    image: postgres:16-alpine
    container_name: artesa-postgres
    environment:
      POSTGRES_DB: artesa
      POSTGRES_USER: artesa
      POSTGRES_PASSWORD: artesa
    ports:
      - "5433:5432"
    volumes:
      - artesa-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U artesa -d artesa"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  artesa-pg-data:
