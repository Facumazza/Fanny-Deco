spring:
  application:
    name: artesa
  datasource:
    url: jdbc:postgresql://localhost:5433/artesa
    username: artesa
    password: artesa
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
  servlet:
    session:
      timeout: 7d
      cookie:
        name: ARTESA_ADMIN_SESSION
        http-only: true
        same-site: lax
        # secure: true    # enable in production behind HTTPS

spring.servlet.multipart:
  max-file-size: 6MB
  max-request-size: 6MB

artesa:
  uploads:
    directory: ./uploads

# Default admin credentials — CHANGE BEFORE DEPLOYING
artesa:
  admin:
    email: admin@artesa.com
    password: changeme123

logging:
  level:
    org.hibernate.SQL: DEBUG
