spring:
  application:
    name: artesa
  datasource:
    url: jdbc:postgresql://localhost:5432/artesa
    username: artesa
    password: artesa
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

logging:
  level:
    org.hibernate.SQL: DEBUG
