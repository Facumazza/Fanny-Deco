spring:
  application:
    name: artesa
  datasource:
    url: jdbc:postgresql://localhost:5433/artesa
    username: artesa
    password: artesa
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 6MB

server:
  port: 8080
  servlet:
    session:
      timeout: 7d
      cookie:
        name: ARTESA_ADMIN_SESSION
        http-only: true
        same-site: lax
        # secure: true is set by application-prod.yml — do NOT enable here
        # because dev runs over plain HTTP and the browser would drop the cookie.

# Dev-friendly defaults. Production overrides these in application-prod.yml
# (activated via SPRING_PROFILES_ACTIVE=prod) and there they are REQUIRED
# env vars — the app fails to start if they're missing.
artesa:
  admin:
    email: admin@artesa.com
    password: changeme123
  uploads:
    # `local` writes to `directory` on disk and serves /uploads/** statically.
    # In prod, application-prod.yml sets provider=r2 and the app talks to R2 instead.
    provider: local
    directory: ./uploads
  payments:
    # `mercadopago` for real integration, or leave blank/other for tests-with-fake.
    provider: ${ARTESA_PAYMENT_PROVIDER:mercadopago}
    mercadopago:
      access-token:      ${MERCADOPAGO_ACCESS_TOKEN:}
      # HMAC secret from the MP dashboard → Notificaciones → Webhooks → Firma.
      # In dev, empty is fine: incoming webhooks pass through with a startup warning.
      # In prod, application-prod.yml sets require-signature=true and the app
      # refuses to start unless MERCADOPAGO_WEBHOOK_SECRET is provided.
      webhook-secret:    ${MERCADOPAGO_WEBHOOK_SECRET:}
      require-signature: false
    # Public URL of the backend as reachable from MercadoPago's servers.
    # In dev, this is your ngrok URL (e.g. https://abc123.ngrok-free.app).
    public-base-url: ${ARTESA_PUBLIC_BASE_URL:http://localhost:8080}
    # URL of the storefront where the customer will be sent after payment.
    frontend-base-url: ${ARTESA_FRONTEND_BASE_URL:http://localhost:5173}
  # Bank transfer as an alternative payment method. Static config — the shop
  # has one bank account and displays it to customers who choose "pagar por
  # transferencia" at checkout. Fields left blank in dev; production sets
  # them via env vars. If cbu + alias are both blank the endpoint returns
  # 404 and the frontend hides the option.
  bank-transfer:
    enabled:        ${ARTESA_BANK_TRANSFER_ENABLED:true}
    bank-name:      ${ARTESA_BANK_TRANSFER_BANK_NAME:Banco Galicia}
    account-holder: ${ARTESA_BANK_TRANSFER_ACCOUNT_HOLDER:}
    cbu:            ${ARTESA_BANK_TRANSFER_CBU:}
    alias:          ${ARTESA_BANK_TRANSFER_ALIAS:}
    cuit:           ${ARTESA_BANK_TRANSFER_CUIT:}
    contact-method: ${ARTESA_BANK_TRANSFER_CONTACT_METHOD:WhatsApp al +54 9 11 1234-5678}
  emails:
    # `resend` for real integration, `console` to log emails to stdout (dev).
    provider: ${ARTESA_EMAIL_PROVIDER:console}
    from: ${ARTESA_EMAIL_FROM:FannyDeco <no-reply@fannydeco.com>}
    admin-to: ${ARTESA_EMAIL_ADMIN_TO:admin@fannydeco.com}
    shop-name: ${ARTESA_EMAIL_SHOP_NAME:FannyDeco}
    resend:
      api-key: ${RESEND_API_KEY:}

logging:
  level:
    org.hibernate.SQL: DEBUG
