spring:
  application:
    name: artesa
  datasource:
    url: jdbc:postgresql://localhost:5433/artesa
    username: artesa
    password: artesa
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 6MB

server:
  # Railway/Heroku-style hosts inject $PORT with a dynamic port per deploy;
  # Spring's auto-binding only covers SERVER_PORT, so we read PORT explicitly
  # and fall back to 8080 for local dev where $PORT is unset.
  port: ${PORT:8080}
  servlet:
    session:
      timeout: 7d
      cookie:
        name: ARTESA_ADMIN_SESSION
        http-only: true
        same-site: lax
        # secure: true is set by application-prod.yml — do NOT enable here
        # because dev runs over plain HTTP and the browser would drop the cookie.

# Dev-friendly defaults. Production overrides these in application-prod.yml
# (activated via SPRING_PROFILES_ACTIVE=prod) and there they are REQUIRED
# env vars — the app fails to start if they're missing.
artesa:
  admin:
    email: admin@artesa.com
    password: changeme123
  uploads:
    # `local` writes to `directory` on disk and serves /uploads/** statically.
    # In prod, application-prod.yml sets provider=r2 and the app talks to R2 instead.
    provider: ${ARTESA_UPLOADS_PROVIDER:local}
    directory: ./uploads
    # R2 config lives here with empty defaults so a dev can flip provider=r2
    # via env var to smoke-test R2 locally without activating the whole prod
    # profile (which would demand real DB/MP creds). Prod overrides these to
    # required env vars via application-prod.yml (\${VAR:?...}).
    r2:
      account-id:        ${R2_ACCOUNT_ID:}
      access-key-id:     ${R2_ACCESS_KEY_ID:}
      secret-access-key: ${R2_SECRET_ACCESS_KEY:}
      bucket:            ${R2_BUCKET:}
      public-base-url:   ${R2_PUBLIC_BASE_URL:}
  # Bank transfer as the only payment method. Static config — the shop
  # has one bank account and displays it to customers who choose "pagar por
  # transferencia" at checkout. Fields left blank in dev; production sets
  # them via env vars. If cbu + alias are both blank the endpoint returns
  # 404 and the frontend hides the option.
  bank-transfer:
    enabled:        ${ARTESA_BANK_TRANSFER_ENABLED:true}
    bank-name:      ${ARTESA_BANK_TRANSFER_BANK_NAME:Banco Galicia}
    account-holder: ${ARTESA_BANK_TRANSFER_ACCOUNT_HOLDER:}
    cbu:            ${ARTESA_BANK_TRANSFER_CBU:}
    alias:          ${ARTESA_BANK_TRANSFER_ALIAS:}
    cuit:           ${ARTESA_BANK_TRANSFER_CUIT:}
    contact-method: ${ARTESA_BANK_TRANSFER_CONTACT_METHOD:WhatsApp al +54 9 11 1234-5678}
  # Public URL of the storefront (used in email templates that link back to
  # the customer's order page). Formerly under artesa.payments — moved here
  # after MP was removed so it isn't tied to a payment concept.
  frontend-base-url: ${ARTESA_FRONTEND_BASE_URL:http://localhost:5173}
  emails:
    # Only `console` is wired today — customer notifications go via the
    # WhatsApp handoff in the admin panel. The env vars stay optional so that
    # a future Resend/Brevo implementation slots in without config surgery.
    provider: ${ARTESA_EMAILS_PROVIDER:console}
    from: ${ARTESA_EMAILS_FROM:FannyDeco <no-reply@fannydeco.com>}
    admin-to: ${ARTESA_EMAILS_ADMIN_TO:admin@fannydeco.com}
    shop-name: ${ARTESA_EMAILS_SHOP_NAME:FannyDeco}

logging:
  level:
    org.hibernate.SQL: DEBUG
