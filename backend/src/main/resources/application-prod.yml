# Production profile — activate with SPRING_PROFILES_ACTIVE=prod.
#
# Every value below is a REQUIRED env var: the `${VAR:?message}` syntax makes
# Spring throw a clear IllegalArgumentException at boot if the var is missing.
# That is intentional — we would rather refuse to start than come up with
# insecure defaults ("changeme123") from application.yml quietly winning.

spring:
  datasource:
    url:      ${ARTESA_DB_URL:?ARTESA_DB_URL required (e.g. jdbc:postgresql://host:5432/artesa)}
    username: ${ARTESA_DB_USER:?ARTESA_DB_USER required}
    password: ${ARTESA_DB_PASSWORD:?ARTESA_DB_PASSWORD required}

server:
  servlet:
    session:
      # Shorter than dev's 7 days: admins with full write access should re-auth
      # more often. Adjust if this is too aggressive for your team.
      timeout: 12h
      cookie:
        # HTTPS-only cookie. The app is expected to sit behind a TLS-terminating
        # reverse proxy (Cloudflare, nginx, Caddy) — the proxy sets the
        # X-Forwarded-Proto header Spring uses to decide.
        secure: true

artesa:
  uploads:
    # Cloudflare R2 in prod — Railway containers are ephemeral, local disk
    # gets wiped on every deploy so we can't use LocalStorageBackend here.
    provider: r2
    r2:
      account-id:        ${R2_ACCOUNT_ID:?R2_ACCOUNT_ID required}
      access-key-id:     ${R2_ACCESS_KEY_ID:?R2_ACCESS_KEY_ID required}
      secret-access-key: ${R2_SECRET_ACCESS_KEY:?R2_SECRET_ACCESS_KEY required}
      bucket:            ${R2_BUCKET:?R2_BUCKET required (e.g. fannydeco-uploads)}
      # The public URL prefix objects will be served under. R2 gives a
      # `https://pub-<hash>.r2.dev` URL when you enable public access on the
      # bucket, or set a custom domain and put it here.
      public-base-url:   ${R2_PUBLIC_BASE_URL:?R2_PUBLIC_BASE_URL required (e.g. https://pub-abc.r2.dev)}
  admin:
    email:    ${ARTESA_ADMIN_EMAIL:?ARTESA_ADMIN_EMAIL required}
    password: ${ARTESA_ADMIN_PASSWORD:?ARTESA_ADMIN_PASSWORD required (use a strong, unique password)}

logging:
  level:
    # Silence the DEBUG SQL firehose from dev.
    org.hibernate.SQL: INFO
    # Keep app logs at INFO; bump to DEBUG per-package temporarily via env var
    # if you need to trace something without redeploying.
    com.artesa: INFO
