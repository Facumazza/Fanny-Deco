name: CI

# Runs on every push and every PR. Railway and Vercel each auto-deploy on
# push to main via their own GitHub integrations, so this workflow's job is
# just to prove the code compiles + tests pass — it does NOT trigger deploys
# itself (which keeps secrets out of GitHub Actions and makes rollbacks
# platform-native).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — mvn test
    runs-on: ubuntu-latest
    # Docker is preinstalled on ubuntu-latest, which Testcontainers uses to
    # spin up a Postgres instance per IT class. No `services:` block needed.
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compile + run all tests
        working-directory: backend
        # -B: batch mode (cleaner logs). --no-transfer-progress: drop the
        # download bar spam that pollutes CI output.
        run: ./mvnw -B --no-transfer-progress test

  frontend:
    name: Frontend — tsc + vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        # `npm ci` is faster + reproducible from lockfile; fails if lock is stale.
        run: npm ci

      - name: TypeScript type-check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Unit tests
        working-directory: frontend
        run: npm test -- --run
